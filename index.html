<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分数の比例定数とグラフの傾き</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --red: #dc2626;
      --green: #059669;
      --amber: #f59e0b;
      --purple: #7c3aed;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: manipulation;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 3.5rem;
      line-height: 1;
    }

    .fraction .num,
    .fraction .den {
      font-weight: 800;
      letter-spacing: -0.04em;
      font-family: 'JetBrains Mono', monospace;
    }

    .fraction .bar {
      width: 100%;
      height: 2px;
      background: rgba(100, 116, 139, 0.7);
      margin: 0.18rem 0;
      border-radius: 9999px;
    }

    .fraction .num { color: var(--red); }
    .fraction .den { color: var(--blue); }

    .formula-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.06), rgba(59, 130, 246, 0.04));
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .tab-button.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .tab-button {
      color: #475569;
    }

    .grid-cell {
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
    }

    .range {
      accent-color: #4f46e5;
    }

    .pill {
      border-radius: 9999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: white;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .status-dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 9999px;
      display: inline-block;
      margin-right: 0.5rem;
    }

    .shadow-soft {
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .graph-wrap {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800">
  <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
      <div class="space-y-6">
        <div class="formula-box shadow-soft rounded-3xl p-5 sm:p-6">
          <div class="flex items-center justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">比例定数</p>
              <h1 class="mt-2 text-2xl font-extrabold text-slate-800">分数の比例定数とグラフの傾き</h1>
            </div>
            <div class="inline-flex items-center gap-2 rounded-full border border-indigo-200 bg-white/80 px-3 py-1.5 text-sm font-bold text-indigo-600">
              <span class="status-dot bg-emerald-500"></span>
              連動中
            </div>
          </div>

          <div class="mt-6 grid gap-5 md:grid-cols-[auto_1fr] md:items-center">
            <div class="rounded-2xl border border-slate-200 bg-white/90 px-4 py-3 shadow-sm">
              <div class="fraction" aria-live="polite">
                <div id="fractionNum" class="num text-3xl">3</div>
                <div class="bar"></div>
                <div id="fractionDen" class="den text-3xl">4</div>
              </div>
            </div>

            <div class="space-y-2">
              <div class="flex items-center gap-3 text-sm text-slate-600">
                <span class="pill px-3 py-1 text-slate-700">k = <span id="fractionText">3/4</span></span>
                <span class="text-slate-500">小数</span>
                <span class="pill px-3 py-1 text-indigo-700" id="decimalValue">0.75</span>
              </div>

              <p id="explanationText" class="text-lg font-bold text-slate-700 leading-relaxed">
                右に4進むと、上に3上がります。
              </p>
            </div>
          </div>
        </div>

        <div class="rounded-3xl bg-white p-5 shadow-soft border border-slate-200">
          <div class="flex items-center justify-between gap-4 mb-3 flex-wrap">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">グラフ</p>
              <h2 class="mt-1 text-xl font-extrabold text-slate-800">比例の直線</h2>
            </div>
            <div class="pill px-3 py-1 text-indigo-700 text-sm font-bold">
              y = (<span id="graphSlopeValue">3</span>/4)x
            </div>
          </div>

          <div class="graph-wrap rounded-2xl border border-slate-200 p-2">
            <svg id="graphSvg" viewBox="0 0 360 300" class="block h-72 w-full rounded-xl" aria-label="比例のグラフ">
              <g id="graphLayer"></g>
            </svg>
          </div>
        </div>

        <div class="rounded-3xl bg-white p-5 shadow-soft border border-slate-200">
          <div class="flex items-center justify-between gap-4 mb-3 flex-wrap">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">スライダー</p>
              <h2 class="mt-1 text-xl font-extrabold text-slate-800">分子の大きさ</h2>
            </div>
            <div class="pill px-3 py-1 text-indigo-700 text-sm font-bold">
              <span id="sliderValueLabel">3</span>
            </div>
          </div>

          <input id="ratioSlider" class="range w-full h-2 rounded-lg cursor-pointer" type="range" min="1" max="9" step="1" value="3" />

          <div class="mt-4 flex justify-between text-sm text-slate-500 font-semibold">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
          </div>
        </div>
      </div>

      <div class="rounded-3xl bg-white p-5 shadow-soft border border-slate-200">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">確認</p>
        <h2 class="mt-2 text-xl font-extrabold text-slate-800">グラフの見方</h2>

        <div class="mt-5 space-y-4 text-sm text-slate-600">
          <div class="grid-cell p-4">
            <p class="font-bold text-slate-700">比例の式</p>
            <p class="mt-2 text-lg font-extrabold text-indigo-600" id="equationText">y = (3/4)x</p>
          </div>

          <div class="grid-cell p-4">
            <p class="font-bold text-slate-700">分数の意味</p>
            <p class="mt-2 text-base leading-relaxed">
              <span class="text-red-600 font-extrabold">分子</span>は上、<span class="text-blue-600 font-extrabold">分母</span>は下です。
            </p>
          </div>

          <div class="grid-cell p-4">
            <p class="font-bold text-slate-700">傾きの説明</p>
            <p class="mt-2 leading-relaxed" id="slopeText">
              右に4進むと、上に3上がるので、傾きは 3/4 です。
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('ratioSlider');
    const fractionNum = document.getElementById('fractionNum');
    const fractionDen = document.getElementById('fractionDen');
    const fractionText = document.getElementById('fractionText');
    const decimalValue = document.getElementById('decimalValue');
    const explanationText = document.getElementById('explanationText');
    const equationText = document.getElementById('equationText');
    const slopeText = document.getElementById('slopeText');
    const sliderValueLabel = document.getElementById('sliderValueLabel');
    const graphSlopeValue = document.getElementById('graphSlopeValue');
    const graphLayer = document.getElementById('graphLayer');

    const denominator = 4;
    const xMax = 8;
    const yMax = 20;
    const width = 360;
    const height = 300;
    const padding = { top: 18, right: 18, bottom: 42, left: 42 };

    function formatDecimal(value) {
      return Number(value).toFixed(2);
    }

    function xScale(value) {
      return padding.left + (value / xMax) * (width - padding.left - padding.right);
    }

    function yScale(value) {
      return height - padding.bottom - (value / yMax) * (height - padding.top - padding.bottom);
    }

    function drawGraph(numerator) {
      const lineValue = numerator / denominator;
      const x2 = xMax;
      const y2 = lineValue * xMax;

      const tickValuesX = Array.from({ length: xMax + 1 }, (_, i) => i);
      const tickValuesY = [0, 5, 10, 15, 20];

      const gridLines = [];
      tickValuesX.forEach((tick) => {
        const x = xScale(tick);
        gridLines.push(`<line x1="${x}" y1="${padding.top}" x2="${x}" y2="${height - padding.bottom}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" />`);
        gridLines.push(`<text x="${x}" y="${height - 12}" text-anchor="middle" font-size="11" fill="#64748b">${tick}</text>`);
      });

      tickValuesY.forEach((tick) => {
        const y = yScale(tick);
        gridLines.push(`<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />`);
        gridLines.push(`<text x="${padding.left - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#64748b">${tick}</text>`);
      });

      const pointX = xScale(4);
      const pointY = yScale(numerator);
      const line = `M ${padding.left} ${yScale(0)} L ${xScale(x2)} ${yScale(y2)}`;

      graphLayer.innerHTML = `
        <rect x="0" y="0" width="${width}" height="${height}" fill="transparent" />
        ${gridLines.join('')}
        <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="#0f172a" stroke-width="2" />
        <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="#0f172a" stroke-width="2" />
        <path d="${line}" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="${pointX}" cy="${pointY}" r="5" fill="#ef4444" stroke="#fff" stroke-width="2" />
        <text x="${width - 16}" y="${height - 14}" text-anchor="end" font-size="12" fill="#0f172a" font-weight="700">x</text>
        <text x="${padding.left + 8}" y="${padding.top + 8}" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">y</text>
      `;
    }

    function updateVisuals() {
      const numerator = Number(slider.value);
      const value = numerator / denominator;

      fractionNum.textContent = numerator;
      fractionDen.textContent = denominator;
      fractionText.textContent = `${numerator}/${denominator}`;
      decimalValue.textContent = formatDecimal(value);
      sliderValueLabel.textContent = numerator;
      graphSlopeValue.textContent = numerator;

      explanationText.textContent = `右に${denominator}進むと、上に${numerator}上がります。`;
      equationText.textContent = `y = (${numerator}/${denominator})x`;
      slopeText.textContent = `右に${denominator}進むと、上に${numerator}上がるので、傾きは ${numerator}/${denominator} です。`;

      drawGraph(numerator);
    }

    slider.addEventListener('input', updateVisuals);
    updateVisuals();
  </script>
</body>
</html>
